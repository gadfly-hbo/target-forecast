<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>测算工作台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">测算工作台</div>
    <nav id="nav" aria-label="测算工具"></nav>
    <div class="sidebar-foot">全部数据与测算在本机完成<br>不上传任何明细数据</div>
  </aside>
  <div class="main">
    <main class="content">
      <iframe id="frame" title="测算工具"></iframe>
    </main>
    <footer id="statusbar" class="statusbar">
      <span id="sb-product" class="sb-item">测算工作台</span>
      <span class="sb-sep">·</span>
      <span id="sb-tool" class="sb-item">—</span>
      <span id="sb-demo" class="sb-demo hidden">演示数据</span>
      <button type="button" id="assistant-toggle" class="as-toggle" title="助手">🤖 助手</button>
      <span class="sb-spacer"></span>
      <span id="sb-llm" class="sb-item"></span>
      <span class="sb-item sb-meta">全部数据与测算在本机完成，不上传明细数据</span>
    </footer>
  </div>
  <aside id="assistant" class="assistant hidden" aria-label="测算助手">
    <div class="as-head">
      <span>测算助手</span>
      <span id="as-backend" class="as-backend"></span>
    </div>
    <div id="as-msgs" class="as-msgs"></div>
    <div id="as-confirm" class="as-confirm hidden"></div>
    <div class="as-inputbar">
      <input id="as-input" type="text" placeholder="问点什么，如：基准情景净贡献是多少" aria-label="助手输入">
      <button type="button" id="as-send">发送</button>
    </div>
  </aside>
</div>
<script src="app.js"></script>
</body>
</html>
