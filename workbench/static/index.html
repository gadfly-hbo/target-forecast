<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>测算工作台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">测算工作台</div>
    <nav id="nav" aria-label="测算工具"></nav>
    <div class="sidebar-foot">全部数据与测算在本机完成<br>不上传任何明细数据</div>
  </aside>
  <div class="main">
    <main class="content">
      <iframe id="frame" title="测算工具"></iframe>
    </main>
    <footer id="statusbar" class="statusbar">
      <span id="sb-product" class="sb-item">测算工作台</span>
      <span class="sb-sep">·</span>
      <span id="sb-tool" class="sb-item">—</span>
      <span id="sb-demo" class="sb-demo hidden">演示数据</span>
      <span class="sb-spacer"></span>
      <span class="sb-item sb-meta">全部数据与测算在本机完成，不上传明细数据</span>
    </footer>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
